[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tohe-experiments"
version = "0.1.0"
description = "WordNet graph-to-text experiments with frozen language models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "nltk>=3.9"]

[project.scripts]
tohe = "tohe.cli:main"

[tool.setuptools.packages.find]
include = ["tohe*"]
